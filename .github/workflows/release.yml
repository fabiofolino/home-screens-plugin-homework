name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="fab-homework"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/dist"
          cp manifest.json README.md LICENSE "$STAGE/"
          cp dist/bundle.js "$STAGE/dist/"
          tar -czf "fab-homework-${VERSION}.tar.gz" "$STAGE"
          sha256sum "fab-homework-${VERSION}.tar.gz" > "fab-homework-${VERSION}.sha256"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fab-homework-*.tar.gz
            fab-homework-*.sha256
